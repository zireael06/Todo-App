<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Task Tracker</title>
</head>

<body>
    
    <button
        type="button"
        id="theme-toggle"
        class="button"
        aria-label="Toggle dark mode">
        <i class="fa-solid fa-moon"></i>
    </button>

    <main class="app">
        <div class="tracker" aria-label="Task tracker">
            <h1>Task Tracker</h1>
                
            <div class="input-group">
                <label for="task-input" class="sr-only">Task</label>
                <input type="text" id="task-input" class="text-input" placeholder="Enter a task..." autocomplete="off">
                <button type="button" class="button" id="priority-selector">Priority: Medium</button>
                <button type="button" class="button" aria-label="Add task" id="addTaskBtn">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                </button>
            </div>
                
            <div class="input-group">
                <label for="search-input" class="sr-only">Search</label>
            
                <div class="search-input">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="text" id="search-input" class="text-input" placeholder="Search tasks..." autocomplete="off">
                </div>

            </div>
            
            <div class="filter-buttons">
                <button type="button" class="button filter-button" id="filterAllBtn">All</button>
                <button type="button" class="button filter-button" id="filterActiveBtn">Active</button>
                <button type="button" class="button filter-button" id="filterCompletedBtn">Completed</button>
            </div>

            <p id="taskCounter" aria-live="polite"></p>
            <ul id="taskList"></ul>
        
        </div>
    </main>  
    
    <script type="module" src="js/app.js"></script>
</body>

</html>
